# 私人营养师 PWA 的 nginx 站点配置模板。
# 用法：把 release/pwa 同步到 /var/www/nutri，本文件放到 /etc/nginx/conf.d/nutri.conf（或 sites-available 并软链），
# 按实际情况改 server_name / listen / 证书路径，然后 nginx -t && systemctl reload nginx。
# 如果服务器上 80/443 已被 openclaw 占用，改成子路径或另一个端口见文末。

server {
    listen 80;
    # 有域名填域名；只用 IP 访问就留 _（此时没有 HTTPS，离线缓存不生效但功能可用）
    server_name _;

    root /var/www/nutri;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/manifest+json image/svg+xml application/json;
    gzip_min_length 1024;

    # 应用壳与 service worker 不缓存，保证发新版后手机端能及时拿到
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
    location = /version.json { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "max-age=3600"; }

    # 图标可长期缓存
    location /icons/ { add_header Cache-Control "max-age=2592000, immutable"; }

    location / { try_files $uri $uri/ /index.html; }
}

# ---- 有域名且要 HTTPS 时，用 certbot 自动改写上面的 server，或参考下面 ----
# server {
#     listen 443 ssl http2;
#     server_name nutri.example.com;
#     ssl_certificate     /etc/letsencrypt/live/nutri.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/nutri.example.com/privkey.pem;
#     root /var/www/nutri; index index.html;
#     ...同上 location 规则...
# }

# ---- 80 端口已被别的站点占用时，两种做法 ----
# 1) 挂到现有站点的子路径：在那个 server 里加
#    location /nutri/ { alias /var/www/nutri/; try_files $uri $uri/ /nutri/index.html; }
#    （构建已用相对路径，子路径可直接用；sw.js 的作用域会自动落在 /nutri/ 下）
# 2) 换端口：把上面的 listen 80 改成 listen 8080，并在阿里云轻量控制台防火墙放行 8080/TCP。
