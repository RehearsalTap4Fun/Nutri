# 静态项目总站（服务器上实际文件：/etc/nginx/conf.d/nutri.conf + nutri-site.inc）
# 根目录 /var/www，每个项目一个子目录；公共段放 include，80 与 443 共用。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.109.97.108;           # 绑域名后换成域名（内地服务器需先备案）
    include /etc/nginx/conf.d/nutri-site.inc;
}

# HTTPS：无域名时用 Let's Encrypt 的 IP 证书（shortlived 档，6 天，acme.sh 每 3 天续）
#   ~/.acme.sh/acme.sh --issue --server letsencrypt --certificate-profile shortlived -d <IP> -w /var/www/acme --days 3
#   ~/.acme.sh/acme.sh --install-cert --ecc -d <IP> --key-file /etc/nginx/ssl/nutri.key --fullchain-file /etc/nginx/ssl/nutri.crt --reloadcmd "sudo -n nginx -t && sudo -n systemctl reload nginx"
# 有已备案域名时：--issue -d your.domain -w /var/www/acme（默认 90 天档），其余相同。
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 47.109.97.108;
    ssl_certificate     /etc/nginx/ssl/nutri.crt;
    ssl_certificate_key /etc/nginx/ssl/nutri.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/conf.d/nutri-site.inc;
}

